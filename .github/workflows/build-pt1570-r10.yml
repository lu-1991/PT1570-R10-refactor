# SPDX-License-Identifier: MIT
# 友华 PT1570-R10 (RTL9617C, 4xGE) OpenWrt 云编译 —— 云端拉库版
#
# 本仓库只保存「适配层」：两个补丁 + DTS + 配置脚本 + 本工作流（约几十 KB）。
# 编译时由 scripts/cloud-pull.sh 从上游 lyq1996/rtl9617c-openwrt 拉取源码，
# 再叠加真机验证的硬件层与 PT1570-R10 设备定义，全程在云端完成。
# 上传本仓库到 GitHub 后，在 Actions 页面手动运行 "Build PT1570-R10" 即可。

name: Build PT1570-R10 (云端拉库)

on:
  workflow_dispatch:
    inputs:
      wifi_ssid:
        description: '默认 WiFi 名称 (SSID)'
        required: false
        default: 'PT1570-R10'
        type: string
      wifi_key:
        description: '默认 WiFi 密码 (至少 8 位)'
        required: false
        default: '12345678'
        type: string
      lan_ip:
        description: '默认管理地址'
        required: false
        default: '192.168.1.1'
        type: string
      make_release:
        description: '编译成功后发布为 Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      WRT_SRC: openwrt
      WRT_SSID: ${{ inputs.wifi_ssid || 'PT1570-R10' }}
      WRT_WORD: ${{ inputs.wifi_key || '12345678' }}
      WRT_IP: ${{ inputs.lan_ip || '192.168.1.1' }}

    steps:
      # 只 checkout 轻量适配层，不上传完整源码树
      - name: Checkout adapter repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pip rsync unzip \
            zlib1g-dev file wget curl ccache device-tree-compiler xz-utils \
            perl texinfo help2man ncurses-term
          python3 -m pip install --upgrade --break-system-packages pyelftools

      # 核心：云端从上游拉取源码 + 叠加硬件层与 PT1570-R10 适配
      - name: Pull upstream source and apply PT1570-R10 adaptation
        run: bash scripts/cloud-pull.sh "$WRT_SRC"

      - name: Feeds update and install
        working-directory: ${{ env.WRT_SRC }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: ${{ env.WRT_SRC }}
        run: |
          set -e
          ADAPTER="$GITHUB_WORKSPACE"
          # 关键顺序：先写最小 target 配置，再 defconfig，
          # 之后再追加包断言并二次 defconfig。
          cp "$ADAPTER/config-pt1570-r10.txt" .config
          chmod +x "$ADAPTER/customize-pt1570.sh"
          "$ADAPTER/customize-pt1570.sh"
          make defconfig
          "$ADAPTER/customize-pt1570.sh"
          make defconfig

          echo "--- 配置校验 ---"
          grep -q '^CONFIG_TARGET_rtl9617c_generic_DEVICE_youhua_pt1570_r10=y$' .config \
            || { echo "ERROR: 机型 profile 未生效" >&2; exit 1; }
          grep -q '^CONFIG_UIMAGE_FIT_BLK=y$' target/linux/rtl9617c/config-6.18 \
            || { echo "ERROR: 缺少 FIT blk 内核配置" >&2; exit 1; }
          grep -q '^CONFIG_MTD_ROOTFS_ROOT_DEV=y$' target/linux/generic/config-6.18 \
            || { echo "ERROR: 缺少 MTD rootfs root dev 配置" >&2; exit 1; }
          test -f target/linux/rtl9617c/dts/rtl9617c-pt1570-r10.dts \
            || { echo "ERROR: 缺少 PT1570-R10 DTS" >&2; exit 1; }
          grep -q 'youhua,pt1570-r10' target/linux/rtl9617c/base-files/lib/upgrade/platform.sh \
            || { echo "ERROR: sysupgrade 白名单未包含 PT1570-R10" >&2; exit 1; }
          echo "配置校验通过"

      - name: Download sources
        working-directory: ${{ env.WRT_SRC }}
        run: make -j$(nproc) download

      - name: Build firmware
        working-directory: ${{ env.WRT_SRC }}
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log || {
            echo "==== 并行编译失败，尝试单线程定位错误 ===="
            make -j1 V=s 2>&1 | tee -a build.log
          }

      - name: Collect firmware
        id: collect
        working-directory: ${{ env.WRT_SRC }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$OUT"
          BIN="bin/targets/rtl9617c/generic"
          ls -la "$BIN"
          cp "$BIN"/openwrt-rtl9617c-generic-youhua_pt1570_r10-sysupgrade.itb "$OUT/" 2>/dev/null || \
          cp "$BIN"/*youhua_pt1570_r10*sysupgrade*.itb "$OUT/"
          cp "$BIN"/sha256sums "$OUT/" 2>/dev/null || true
          cp .config "$OUT/config-pt1570-r10-final.txt"
          cp build.log "$OUT/build.log" 2>/dev/null || true
          echo "--- 产物 ---"
          ls -lh "$OUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: PT1570-R10-firmware
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pt1570-r10-${{ github.run_number }}
          name: PT1570-R10 firmware #${{ github.run_number }}
          body: |
            友华 PT1570-R10 (RTL9617C, 4xGE) OpenWrt 固件（云端拉库编译）
            - 内核 6.18 / FIT UBI 启动 / sysupgrade.itb
            - 源码上游: lyq1996/rtl9617c-openwrt @ refactor + 硬件层 20b4cf4
            - 默认管理地址: ${{ inputs.lan_ip || '192.168.1.1' }}
            刷机前请备份原厂分区 (尤其 mtd1/env、mtd4/ubi_device 中的 factory 卷)。
          files: artifacts/*youhua_pt1570_r10*sysupgrade*.itb
